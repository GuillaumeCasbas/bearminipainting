agent_type = "agent"
display_name = "Code Quality"
description = "Agent for code review and quality assurance"
safety = "safe"
disabled_tools = []

# Auto-loaded skills
[skill]
code-quality = true

[tools.bash]
permission = "ask"

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.search_replace]
permission = "ask"

[tools.grep]
permission = "always"

[tools.todo]
permission = "always"
