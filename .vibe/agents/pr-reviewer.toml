agent_type = "agent"
display_name = "PR Reviewer"
description = "Agent pour la revue des Pull Requests et l'analyse des changements"
safety = "safe"
disabled_tools = []

# Auto-loaded skills
[skill]
pull-request-review = true

[tools.bash]
permission = "ask"

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.search_replace]
permission = "ask"

[tools.grep]
permission = "always"

[tools.todo]
permission = "always"
